<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🎂</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars"></div>

  <main class="card">
    <div class="balloon b1">🎈</div>
    <div class="balloon b2">🎈</div>
    <div class="balloon b3">🎈</div>

    <p class="small">A little surprise just for you ✨</p>
    <h1>Happy Birthday</h1>
    <h2>Shree Sakhii 💜</h2>

    <div class="photo-wrap">
      <img src="1000188911.jpg" alt="Birthday photo">
    </div>

    <p class="message" id="message">
      May your special day be filled with happiness, laughter,
      beautiful memories and lots of reasons to smile. 💜
    </p>

    <button id="surpriseBtn">🎁 Open Your Surprise</button>

    <div id="surprise" class="surprise">
      <div class="cake">🎂</div>
      <h3>Make a Wish! ✨</h3>
      <p>Today is your day — enjoy every beautiful moment. 🥳</p>
    </div>
  </main>

  <div id="confetti"></div>
  <script src="script.js"></script>
</body>
</html>
